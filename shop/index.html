<style>
/* shop skeleton: items live on Ko-fi · this page only points there · empty = "coming soon", never a countdown */
.door{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.door small{color:var(--muted);font-size:.84rem;flex-basis:100%}
.items{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.item{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.item .pic{aspect-ratio:1/1;background:repeating-linear-gradient(135deg,var(--lh-paper-hatch-a) 0 6px,var(--lh-paper-hatch-b) 6px 12px);position:relative}
.item .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .b{padding:12px 14px 14px;display:grid;gap:4px;align-content:start}
.item h2{margin:0;font:700 1.4rem/1.1 var(--f-hand)}
html[lang="th"] .item h2,html[lang="th"] .soon .hand{font-family:"Sriracha","Caveat",cursive;font-weight:400}
.item p{margin:0;font-size:.86rem;color:var(--label)}
.item .price{font:500 .9rem var(--f-mono);color:var(--paper-ink)}
.item a{font:500 .74rem var(--f-mono);letter-spacing:.06em;color:var(--lh-stamp-wait);margin-top:4px}
.soon{margin-top:26px;border:1.5px dashed rgba(var(--lh-ink-rgb),.26);border-radius:10px;padding:26px 18px;text-align:center;display:grid;gap:6px;justify-items:center;background:radial-gradient(70% 70% at 50% 40%,var(--fog),transparent 70%)}
.soon .lampi{width:16px;height:21px;border-radius:50% 50% 45% 45%;background:var(--lh-unlit)}
.soon .hand{font-size:1.7rem;color:var(--ink)}
.soon p{margin:0;color:var(--muted);max-width:30em}
</style>

<script type="application/json" id="fb-shop">{"kofiUrl":"https://ko-fi.com/littlehill","items":[]}</script>
<script src="../assets/future.js"></script>
<script>
(function(){
  var TX={
    en:{kicker:'littlehill · station kiosk',title:'Shop',lede:'Small things from the hill. Everything is kept on Ko-fi; this page just shows the way there.',
        kofi:'littlehill on Ko-fi ↗',out:'Opens Ko-fi in a new tab. Payment happens there, not on this site.',
        soonH:'Souvenirs are coming.',soonB:'Nothing is on the shelf yet. When something is ready it will appear here.',
        get:'On Ko-fi ↗',foot:'© Dell / littlehill. Prices are in US dollars on Ko-fi.'},
    th:{kicker:'littlehill · ซุ้มหน้าสถานี',title:'ร้าน',lede:'ของเล็ก ๆ จากเนิน · ของทุกชิ้นอยู่บน Ko-fi หน้านี้แค่ชี้ทางไป',
        kofi:'littlehill บน Ko-fi ↗',out:'เปิด Ko-fi ในแท็บใหม่ · จ่ายเงินที่นั่น ไม่ใช่ที่เว็บนี้',
        soonH:'ของที่ระลึก เร็ว ๆ นี้',soonB:'ตอนนี้ชั้นยังว่าง · พร้อมเมื่อไหร่จะขึ้นที่นี่',
        get:'ดูบน Ko-fi ↗',foot:'© Dell / littlehill · ราคาบน Ko-fi เป็นดอลลาร์สหรัฐ'}};
  var SHOP=LH.inline('fb-shop')||{items:[]};
  var $=function(id){return document.getElementById(id);};
  function safeUrl(u){return typeof u==='string'&&/^https:\/\//i.test(u)?u:'';}
  function render(){
    var L=TX[LH.lang],E=LH.esc,items=(SHOP.items||[]).filter(function(x){return x&&LH.loc(x.name)&&safeUrl(x.url);});
    $('kicker').textContent=L.kicker;$('title').textContent=L.title;$('lede').textContent=L.lede;$('out').textContent=L.out;$('foot').textContent=L.foot;
    var k=$('kofi');k.textContent=L.kofi;k.href=safeUrl(SHOP.kofiUrl)||'https://ko-fi.com/littlehill';
    $('items').innerHTML=items.map(function(x){
      var img=typeof x.img==='string'&&/^[\w\-./]+$/.test(x.img)&&x.img.indexOf('..')<0?'<img alt="" loading="lazy" decoding="async" data-src="'+E(x.img)+'">':'';
      return '<li class="item paper"><div class="pic">'+img+'</div><div class="b"><h2>'+E(LH.loc(x.name))+'</h2>'+(LH.loc(x.note)?'<p>'+E(LH.loc(x.note))+'</p>':'')+
        (x.price?'<span class="price">'+E(x.price)+'</span>':'')+'<a href="'+E(safeUrl(x.url))+'" target="_blank" rel="noopener">'+L.get+'</a></div></li>';}).join('');
    [].forEach.call($('items').querySelectorAll('img[data-src]'),function(im){im.addEventListener('error',function(){im.remove();});im.src=im.getAttribute('data-src');});
    $('items').hidden=!items.length;
    $('soon').hidden=!!items.length;
    $('soon').innerHTML='<span class="lampi" aria-hidden="true"></span><span class="hand">'+E(L.soonH)+'</span><p>'+E(L.soonB)+'</p>';
  }
  LH.start({key:'shop',root:'../',render:render}).then(function(show){
    if(!show)return;
    LH.get('shop.json').then(function(j){SHOP=j;LH.redraw();},function(){});
  });
})();
</script>
