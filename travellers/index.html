.langsw button{font:600 .7rem Karla,"IBM Plex Sans Thai",sans-serif;color:var(--ink);background:none;border:0;border-radius:999px;padding:5px 9px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--ink);color:#141a30}
.preview-bar{position:relative;z-index:6;margin:10px 16px 0}
.closed{position:relative;z-index:6}
.mono{font:500 .62rem var(--mono);letter-spacing:.14em}
.ttl{position:relative;z-index:3;text-align:center;margin-top:-6px;padding:0 16px}
.ttl h1{margin:0;font:400 clamp(3rem,8vw,4.2rem)/1 "Reenie Beanie",cursive}
html[lang="th"] .ttl h1{font:400 clamp(2.2rem,7vw,3rem)/1.2 "Sriracha",cursive}
.ttl p{margin:6px auto 0;max-width:36em;color:var(--ink2);font-size:14px}
.sum{display:flex;gap:8px 20px;justify-content:center;margin-top:10px;color:var(--ink2);flex-wrap:wrap}

.gal{position:relative;margin:24px auto 0;width:min(1180px,100%);height:var(--gh,760px);overflow-x:clip}
.gal svg.line{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.hill{position:absolute;left:0;right:0;bottom:-60px;height:180px;background:#0a0d22;border-radius:50% 50% 0 0/100% 100% 0 0;z-index:0}
.fr{position:absolute;z-index:2;display:block;color:inherit;text-decoration:none;transform:rotate(var(--r));transition:transform .3s}
a.fr:hover,a.fr:focus-visible{transform:rotate(0) translateY(-4px) scale(1.02)}
a.fr:focus-visible{outline:2px solid var(--glow);outline-offset:6px}
.fr .box{position:relative;padding:7px;background:#2a2340;box-shadow:0 22px 34px rgba(0,0,0,.6),inset 0 0 0 2px #3d3360}
.fr .mat{padding:8px;background:#2f2850 var(--mat,none) center/90px}
.fr .pic{position:relative;aspect-ratio:var(--ar);overflow:hidden;background:#151a38}

.fr .lt{position:absolute;left:50%;top:-12px;width:46%;height:7px;margin-left:-23%;background:#3d3360;border-radius:3px;z-index:3}
.fr.home .lt:after{content:"";position:absolute;left:-40%;right:-40%;top:5px;height:180px;background:radial-gradient(50% 55% at 50% 0,var(--ccg),transparent 72%);pointer-events:none}

.fr .tag b{font:700 1.05rem/1 var(--ink-hand);margin-right:6px}
.fr .tag span{font:500 .58rem var(--mono);letter-spacing:.08em;color:var(--pm)}

.fr.home .tag span{color:var(--green)}.fr.look .tag span{color:var(--red)}
.fr.big .tag b{font-size:1.4rem}

.line2:before{content:"";position:absolute;left:4%;right:4%;top:8px;height:1px;background:rgba(236,231,220,.3)}

.ot b{display:block;font:700 1.15rem/1 var(--ink-hand)}.ot span{font:500 .58rem var(--mono);letter-spacing:.08em;color:var(--pm)}

      (img?'<img alt="" decoding="async" src="'+E(dir+'img/'+img+'.webp')+'">':'')+'</div></div></div>'+
      '<div class="tag"><b>'+(t?'No.'+E(no):E(no))+'</b><span>'+E(tagTxt)+'</span></div>';
    var k='fr '+c+(round?' round':'')+(oval?' round oval':'')+(big?' big':'');
    return t?'<a class="'+k+'" href="'+E(dir)+'" style="'+style+'" aria-label="No.'+E(no)+' · '+E(tagTxt)+'">'+inner+'</a>'
            :'<div class="'+k+'" style="'+style+'" tabindex="0" role="button" aria-label="No.'+E(no)+' · '+E(L.empty)+'" data-fog="1">'+inner+'</div>';}
  function render(){
    var L=TX[LH.lang]||TX.en;document.documentElement.lang=LH.lang;
    $('title').textContent=L.title;$('lede').textContent=L.lede;$('foot').textContent=L.foot;$('ownT').textContent=L.ownT;$('ownP').textContent=L.ownP;
    var by={},list=[],order=[];(REG.travellers||[]).forEach(function(t){if(t&&t.no&&stageOf(t)!=='teaser'){by[pad(t.no)]=t;}});
    var n=Math.max(+REG.slots||12,1);Object.keys(by).forEach(function(k){if(+k>n)n=+k;});
    var boarded=Object.keys(by).sort(),home=boarded.filter(function(k){return stageOf(by[k])==='sold';}).length;
    var cur=boarded.filter(function(k){var s=stageOf(by[k]);return s==='preview'||s==='open'||s==='extended'||s==='closed';})[0]||boarded[boarded.length-1]||'001';
    var early=boarded.length<=3;document.body.classList.toggle('early',early);
    $('sum').innerHTML='<span><b>'+boarded.length+'</b>'+E(boarded.length===1?L.seen1:L.seen)+'</span><span><b>'+home+'</b>'+E(L.home)+'</span><span><b>'+(n-boarded.length)+'</b>'+E(early?L.fog:L.left)+'</span>';
    var gal=$('gal');gw=gal.clientWidth||Math.min(1180,innerWidth);var narrow=innerWidth<760,o='',cents=[];
    var nos=[];for(var i=1;i<=n;i++)nos.push(pad(i));
    var rest=nos.filter(function(x){return x!==cur;});
    function slotAt(T,i,dy){var b=T[i%T.length];return {x:b[0],y:b[1]+Math.floor(i/T.length)*dy,w:b[2],ar:b[3],r:b[4]};}
    var gh;
    if(narrow){var bigW=84,off=(innerWidth*.84)*4/3+70;
      o+=frame(by[cur],cur,{x:8,y:0,w:bigW,ar:'3/4',r:-1},true,L,cents,COL[(+cur-1)%COL.length]);
      var T=early?PH_EARLY:PH.filter(function(m){return m[2]>0;}),dy=early?680:1460;
      rest.forEach(function(no,i){var p=slotAt(T,i,dy);p.y=p.y*1.12+off;o+=frame(by[no],no,p,false,L,cents,COL[(+no-1)%COL.length]);});
      var last=cents.reduce(function(m,c){return Math.max(m,c.y);},0);gh=last+innerWidth*.6+120;
    }else{
      var BIG=early?EARLY[0]:LATE_BIG,TS=early?EARLY.slice(1):LATE;
      o+=frame(by[cur],cur,{x:BIG[0],y:BIG[1],w:BIG[2],ar:BIG[3],r:BIG[4]},true,L,cents,COL[(+cur-1)%COL.length]);
      rest.forEach(function(no,i){var p=slotAt(TS,i,560);o+=frame(by[no],no,p,false,L,cents,COL[(+no-1)%COL.length]);});
      gh=Math.max(720,cents.reduce(function(m,c){return Math.max(m,c.y);},0)+260);
      var dn=boarded.length<=1?fill(L.dn1,{n:n-boarded.length}):home?fill(L.dnN,{a:boarded.length,h:home}):fill(L.dnH0,{a:boarded.length});
      o+='<div class="dn" style="left:84%;top:'+(early?520:500)+'px">'+E(dn)+'<small>— DELTA</small></div>';
    }
    gal.style.setProperty('--gh',Math.round(gh)+'px');
    /* the night line: a dotted golden line through the boarded frames, in boarding order */
    var pos={};var all=[cur].concat(rest);all.forEach(function(no,i){pos[no]=cents[i];});
    var pts=boarded.map(function(no){return pos[no];}).filter(Boolean);
    var svg='<svg class="line" viewBox="0 0 '+gw+' '+Math.round(gh)+'" preserveAspectRatio="none" aria-hidden="true">';
    if(pts.length>1)svg+='<polyline points="'+pts.map(function(c){return c.x.toFixed(1)+','+(c.y-16).toFixed(1);}).join(' ')+'" fill="none" stroke="rgba(242,180,90,.45)" stroke-width="1.2" stroke-dasharray="2 6"/>';
    pts.forEach(function(c){svg+='<circle cx="'+c.x.toFixed(1)+'" cy="'+(c.y-16).toFixed(1)+'" r="2.4" fill="#ffd38a"/>';});
    svg+='</svg>';
    gal.innerHTML=svg+o+'<div class="hill"></div>'+(early?'<div class="fog"></div>':'');
    var mb=0;[].forEach.call(gal.querySelectorAll('.fr'),function(f){mb=Math.max(mb,f.offsetTop+f.offsetHeight);});if(mb)gal.style.setProperty('--gh',Math.round(mb+(narrow?110:160))+'px');
    [].forEach.call(gal.querySelectorAll('.pic img'),function(im){im.addEventListener('error',function(){im.parentNode.classList.add('noimg');im.remove();});});
    [].forEach.call(gal.querySelectorAll('[data-fog]'),function(f){function go(){toast(L.fogT);}f.addEventListener('click',go);f.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});
    /* owners' wall: current owners who opted in (and only once the traveller has found a home) */
    var ow=boarded.filter(function(k){var t=by[k];return stageOf(t)==='sold'&&t.ownerOptIn===true&&t.owner;});
    $('own').innerHTML=ow.length?ow.map(function(k,i){return '<div class="ot" style="--r:'+[-3,2,-1,3,-2][i%5]+'deg"><b>'+E(by[k].owner)+'</b><span>'+E(fill(L.with,{n:k}))+'</span></div>';}).join(''):'<p class="none">'+E(L.ownNone)+'</p>';
  }
  var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2200);}
  /* grain: drawn once (no live filter, no blend over moving things) */
  try{var c=document.createElement('canvas');c.width=c.height=160;var x=c.getContext('2d'),d=x.createImageData(160,160),s=7;function r(){s=(s*16807)%2147483647;return s/2147483647;}
    for(var i=0;i<d.data.length;i+=4){var v=r()<.5?255:0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.round(r()*r()*12);}
    x.putImageData(d,0,0);document.documentElement.style.setProperty('--grain','url('+c.toDataURL()+')');}catch(e){}
  (function(w){addEventListener('resize',function(){if(innerWidth!==w){w=innerWidth;if(LH.visible())render();}});})(innerWidth);
  LH.start({key:'travellers',root:'../',render:render}).then(function(show){
    if(!show){regReady();return;}
    LH.get('travellers.json').then(function(j){REG=j;},function(){}).then(function(){
      return Promise.all((REG.travellers||[]).map(function(t){if(!t||!t.data)return null;
        return LH.get('../'+t.data).then(function(d){DATA[t.no]=d;},function(){});}));
    }).then(function(){LH.redraw();var im=[].slice.call(document.querySelectorAll('#gal img'));Promise.race([Promise.all(im.map(function(i){return i.decode?i.decode().catch(function(){}):null;})),new Promise(function(r){setTimeout(r,1500);})]).then(regReady);});
  });
})();
</script>
