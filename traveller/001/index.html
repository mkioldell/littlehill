/* Traveller No.001 · prototype v4 · "A home for No.001"
   Her own idea: the tickets are the windows of a house; the bid lights them from the front door up.
   Her own question: "Is it night yet?" is answered by the viewer's clock (day window / star window, Stop 04).
   Her own colour: amber (her eye, her lit windows). Lantern gold stays for actions only.
   Two hands: official facts in typewriter, her name and lines in handwriting (placeholder until Dell's lettering).
   Catalogue rhythm: full-bleed crop → small object in wide space → pair → full-bleed band. Real-looking paper. */
:root{
  color-scheme:dark;
  --night:#111829; --night-2:#0d1322; --ink:#ece7dc; --muted:#b9b7b3; --dim:#8e96a8;
  --gold:#f2b45a; --gold-rgb:242,180,90; --on-gold:#241a0d; --rule:rgba(236,231,220,.12);
  --amber:#f59a3e; --amber-rgb:245,154,62;
  --paper:#ece6d6; --paper-2:#f4efe3; --paper-ink:#2a2620; --paper-label:#665c4b; --stamp:#8c2a33; --home:#2f6b4a;
  --f-hand:"Reenie Beanie","Sriracha",cursive; --f-type:"Special Elite","IBM Plex Mono","IBM Plex Sans Thai",ui-monospace,monospace;
  --f-body:"Karla","IBM Plex Sans Thai",system-ui,sans-serif; --f-mono:"IBM Plex Mono","IBM Plex Sans Thai",ui-monospace,monospace;
  --slow:cubic-bezier(.22,.61,.24,1);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
#get,#look{scroll-margin-top:12px}
html{background:var(--night)}
body{margin:0;background:var(--night);color:var(--ink);font:16px/1.6 var(--f-body);overflow-x:hidden}
html[lang="th"] body{font-family:"IBM Plex Sans Thai","Karla",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
a{color:var(--paper)}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.kick{font:400 .7rem/1.4 var(--f-type);letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:var(--on-gold);font:600 .98rem/1 var(--f-body);text-decoration:none;border:0;border-radius:999px;padding:16px 26px;min-height:52px;cursor:pointer}
.btn.quiet{background:none;color:var(--ink);padding:16px 6px;border-radius:0;border-bottom:1px solid rgba(236,231,220,.35)}
@media (prefers-reduced-motion:no-preference){.btn{transition:box-shadow .3s}.btn:not(.quiet):hover{box-shadow:0 10px 30px rgba(var(--gold-rgb),.25)}}
.fade{opacity:1}
@media (prefers-reduced-motion:no-preference){.fade.pre{opacity:0;transform:translateY(18px)}.fade{transition:opacity 1.2s var(--slow),transform 1.2s var(--slow)}}
/* paper: real grain + soft photographed shadow */
.paper{position:relative;background:var(--paper);color:var(--paper-ink);box-shadow:0 1px 1px rgba(0,0,0,.25),0 18px 40px -8px rgba(0,0,0,.55),0 40px 80px -30px rgba(0,0,0,.5)}
.paper::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.55;mix-blend-mode:multiply;pointer-events:none;border-radius:inherit}
.press{text-shadow:0 1px 0 rgba(255,255,255,.55),0 -.5px 0 rgba(0,0,0,.18)}
/* handwriting placeholder: marked so nobody mistakes it for Dell's hand */
.hand{font-family:var(--f-hand);font-weight:400}
html.showph .ph{position:relative;outline:1px dashed rgba(var(--amber-rgb),.55);outline-offset:6px}

html[lang="th"] :is(.kick,.rhead .where,.obj span,.cap,.chip b,.tag .lbl,.sig small,.dnote small,.facts dt,.rstat,.ans,.lampline,.after,.honest,.edition){letter-spacing:0}
/* the night behind everything (very faint · drawn once) */
canvas.sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.lowfog{position:fixed;inset:auto 0 0;height:34vh;z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(140,155,185,.06) 60%,rgba(140,155,185,.10))}
body{background:transparent}html{background:linear-gradient(180deg,#121a2c 0,#101727 50%,#0e1424 100%) fixed,#111829}
main{position:relative}
/* top */
.top{position:absolute;inset:0 0 auto;z-index:20;padding-top:max(14px,env(safe-area-inset-top,0px))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:400 1.9rem/1 var(--f-hand);color:var(--ink);text-decoration:none}
.navx{display:flex;gap:22px;font:400 .68rem var(--f-type);letter-spacing:.2em;text-transform:uppercase}
.navx a{color:var(--muted);text-decoration:none}
.langsw{display:flex;gap:2px}
.langsw button{font:400 .72rem var(--f-mono);background:none;border:0;color:var(--dim);padding:6px;cursor:pointer}
.langsw button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
@media (max-width:700px){.navx{display:none}}

/* ===== 1 · stage ===== */
.stage{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(90% 60% at 50% 30%,#22305a 0%,#16203a 45%,var(--night) 80%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.art{position:relative;height:min(58svh,128vw);max-height:900px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 70%,transparent 100%)}
@media (prefers-reduced-motion:no-preference){.art img{transition:opacity 2.4s var(--slow),transform 3.2s var(--slow)}.stage.pre .art img{opacity:0;transform:scale(1.04)}}
.heroinfo{position:relative;margin-top:-84px;padding-bottom:48px;display:grid;gap:12px;justify-items:start}
.idline{display:grid;gap:2px}
.name{font:400 clamp(3.7rem,17vw,6rem)/.78 var(--f-hand);margin:4px 0 0;letter-spacing:.01em;color:#e6e0d4}
.epi{font:400 .7rem/1.35 var(--f-type);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:2px 0 0}
html[lang="th"] .epi{letter-spacing:0;font-size:.86rem}
.quote{font:400 1.75rem/1 var(--f-hand);color:var(--paper);margin:0}
html[lang="th"] .quote{font-family:"Sriracha",cursive;font-size:1.25rem;line-height:1.3}
/* the answer: two little windows, Stop 04 (star window = screen left, day window = screen right) */
.answer{display:flex;align-items:center;gap:10px;margin:0}
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:6px}
.qrow .quote{margin:0}
.eyes{display:flex;gap:6px}
.ew{position:relative;width:18px;height:24px;border-radius:13px 13px 3px 3px;background:#1a2036;box-shadow:inset 0 0 0 2px #3a2c2a;overflow:hidden}
.ew i{position:absolute;inset:3px;border-radius:10px 10px 1px 1px;opacity:0}
.ew.star i{background:radial-gradient(circle at 50% 40%,#fff6e0 0 2px,transparent 3px),radial-gradient(circle at 30% 70%,#e8e4da 0 1px,transparent 2px),#26305a}
.ew.day i{background:radial-gradient(circle at 50% 45%,#fff3cf 0 5px,#ffd98e 6px,#f3c27a 100%)}
.ew.on i{opacity:.85}
.ew.on{box-shadow:inset 0 0 0 2px #3a2c2a}
.ew b{position:absolute;inset:0 0 auto;height:0;background:#3a2c2a}
@media (prefers-reduced-motion:no-preference){.ew i{transition:opacity 1.6s var(--slow)}.eyes.blink .ew b{animation:lid .34s ease-in-out}}
@keyframes lid{0%,100%{height:0}50%{height:100%}}
.ans{font:400 .82rem/1.5 var(--f-type);color:#5b5244}
.ans b{color:var(--stamp);font-weight:400}
.edition{font:400 .7rem var(--f-type);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.edition b{color:var(--amber);font-weight:400}
.heroinfo .edition,.heroinfo .name,.heroinfo .quote{text-shadow:0 1px 12px rgba(8,12,24,.9),0 0 3px rgba(8,12,24,.8)}
/* the art is the way in: tap it to look closer · she breathes, the lantern flickers, dust drifts in its light */
button.art{display:block;width:100%;border:0;padding:0;margin:0;background:none;color:inherit;font:inherit;cursor:zoom-in;-webkit-tap-highlight-color:transparent}
.breath{position:absolute;inset:0;display:block;transform-origin:50% 92%}
@media (prefers-reduced-motion:no-preference){.breath{animation:breath 7s ease-in-out infinite}}
@keyframes breath{0%,100%{transform:none}50%{transform:translateY(-.35%) scale(1.012)}}
.glow{position:absolute;left:var(--lx,80%);top:var(--ly,68%);width:42%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,206,130,.32),rgba(242,180,90,.10) 55%,transparent);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.glow{animation:flick 6s steps(1,end) infinite}}
@keyframes flick{0%{opacity:.9}12%{opacity:1}19%{opacity:.82}23%{opacity:.97}48%{opacity:.88}61%{opacity:1}74%{opacity:.85}88%{opacity:.95}}
canvas.motes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.zoomhint{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:84px;font:400 .66rem var(--f-type);letter-spacing:.18em;text-transform:uppercase;color:rgba(236,231,220,.75);border:1px solid rgba(236,231,220,.25);border-radius:999px;padding:6px 12px;background:rgba(10,14,26,.62)}
html[lang="th"] .zoomhint{letter-spacing:0;font-size:.78rem}
@media (min-width:900px){.zoomhint{bottom:40px;left:40px}}
/* the opening: darkness → the lantern finds her → name is written → the tag is hung (once per visit · any tap skips) */
.curtain{position:absolute;left:var(--lx2,70%);top:var(--ly2,60%);width:256px;height:256px;margin:-128px 0 0 -128px;z-index:6;pointer-events:none;opacity:0;visibility:hidden;background:radial-gradient(circle closest-side,transparent 0,transparent 2%,rgba(8,11,21,.98) 6%);transform-origin:50% 50%;transform:scale(14)}
.stage.pre .curtain{opacity:1;visibility:visible}.stage.pre .wrap{visibility:hidden}.stage.play .curtain{visibility:visible;will-change:transform}
.stage.play .curtain{opacity:1}
@keyframes write{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% 0 -20% 0)}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes hang{0%{opacity:0;transform:translateY(-26px) rotate(-10deg)}40%{opacity:1;transform:rotate(3deg)}68%{transform:rotate(-1.2deg)}86%{transform:rotate(.4deg)}100%{transform:none}}
.stage.play .edition{animation:up .8s var(--slow) .55s both}
.stage.play .name{animation:write 1.1s cubic-bezier(.5,.1,.3,1) .8s both}
.stage.play .epi{animation:type 1s steps(30,end) 1.55s both}
.stage.play .qrow{animation:up .9s var(--slow) 1.9s both}
.stage.play .tag{transform-origin:16px 50%;animation:hang 1.8s var(--slow) 1.35s both}
.stage.play .acts{animation:up .9s var(--slow) 2.1s both}
.stage.play .zoomhint{animation:up .9s var(--slow) 2.8s both}
.stage.play .breath{animation:none}
/* the short opening for reloads: light comes up fast, everything settles in under a second */
.stage.play.short .edition,.stage.play.short .name,.stage.play.short .epi,.stage.play.short .qrow,.stage.play.short .tag,.stage.play.short .acts{animation:up .6s var(--slow) .3s both}
/* viewer: the main art, full screen, tap to zoom, ← → for the other views; closing returns you where you were */
.viewer{border:0;padding:0;background:none;color:var(--ink);max-width:none;max-height:none;width:100%;height:100%;margin:0;inset:0}
.viewer::backdrop{background:rgba(6,9,18,.96)}
.vin{position:relative;height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:56px 0 18px}
.vstage{position:relative;overflow:hidden;display:grid;place-items:center;cursor:zoom-in;touch-action:pan-y}
.vstage img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .6s var(--slow);user-select:none}
.vstage.z{cursor:zoom-out;touch-action:none}.vstage.z img{transform:scale(2.4)}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(20px,env(safe-area-inset-left,0px)) 0;font:400 .72rem var(--f-type);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.vbar b{color:var(--ink);font-weight:400;margin-right:10px}
html[lang="th"] .vbar{letter-spacing:0}
/* where the auction is: four small windows, the current one lit (replaces the night-answer row in the hero) */
.srail{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;list-style:none;margin:2px 0 0;padding:0;font:400 .64rem/1 var(--f-type);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
html[lang="th"] .srail{letter-spacing:0;font-size:.74rem}
.srail li{display:flex;align-items:center;gap:6px}
.srail li+li::before{content:"";width:14px;height:1px;background:rgba(236,231,220,.22);margin-right:2px}
.srail i{width:8px;height:11px;border-radius:4px 4px 1px 1px;background:#2b3146;box-shadow:inset 0 0 0 1px #3a2c2a}
.srail li.done{color:var(--muted)}.srail li.done i{background:#6d6478}
.srail li.cur{color:var(--ink)}.srail li.cur i{background:linear-gradient(#ffd58e,var(--amber));box-shadow:0 0 10px rgba(var(--amber-rgb),.7)}
/* claim tag (cream, typewritten) */
.tag{padding:13px 18px 13px 34px;min-width:min(100%,340px);clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.tag::before{content:"";position:absolute;left:12px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--night);box-shadow:inset 0 0 0 1.5px #b9ab8e;z-index:1}
.tag .lbl{font:400 .66rem var(--f-type);letter-spacing:.2em;text-transform:uppercase;color:var(--paper-label)}
.tag .val{font:400 2.7rem/1 var(--f-type);letter-spacing:-.02em;margin-top:4px}
@media (min-width:900px){.tag .val{font-size:3.1rem}}
.tag .when{font:400 .76rem/1.35 var(--f-type);color:#4f483c;margin-top:6px}
.tag .seal{position:absolute;right:14px;top:14px;z-index:2;font:400 1.35rem/1 var(--f-hand);color:var(--stamp);border:1.5px solid var(--stamp);border-radius:4px;padding:3px 8px;transform:rotate(-7deg);opacity:.9;mix-blend-mode:multiply}
html[lang="th"] .tag .seal{font:400 .85rem/1.2 "Sriracha",cursive}
.tag .seal.home{color:var(--home);border-color:var(--home)}
.tag .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:1px}
@media (prefers-reduced-motion:no-preference){.tag .live{animation:breathe 2.6s ease-in-out infinite}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.acts{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
@media (min-width:900px){
  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center;min-height:min(92svh,860px)}
  .art{grid-column:1;grid-row:1;height:min(96svh,900px);max-height:none}
  .art img{object-fit:contain;object-position:50% 60%;-webkit-mask-image:radial-gradient(closest-side,#000 52%,transparent 100%);mask-image:radial-gradient(closest-side,#000 52%,transparent 100%)}
  .stage .wrap{grid-column:2;grid-row:1;margin:0;padding-left:0}
  .heroinfo{margin-top:0;padding-block:90px;max-width:460px;gap:26px}
  .name{font-size:clamp(5.6rem,7vw,7.6rem)}
}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none;transform:translateY(130%)}
.dock.on{transform:none}
@media (prefers-reduced-motion:no-preference){.dock{transition:transform .6s var(--slow)}}
.dock .in{pointer-events:auto;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;background:rgba(10,14,26,.97);border:1px solid var(--rule);border-radius:999px;padding:6px 6px 6px 18px}
.dock .dt{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.dock .mini{display:flex;gap:3px}
.dock .mini i{width:7px;height:9px;border-radius:4px 4px 1px 1px;background:#2b3146}
.dock .mini i.on{background:var(--amber);box-shadow:0 0 6px rgba(var(--amber-rgb),.7)}
.dock b{font:400 1.25rem/1 var(--f-type);white-space:nowrap}
.dock .btn{min-height:46px;padding:12px 18px;font-size:.9rem}

/* desktop: drag rows with the mouse; images never start a browser drag */
img{-webkit-user-drag:none;user-select:none}
.reel,.strip{cursor:grab}.reel.dragging,.strip.dragging{cursor:grabbing;scroll-snap-type:none}
.reel.dragging *{pointer-events:none}
/* ===== 4 · look closer = a guided tour of the details (v1's lights, now a camera that travels) ===== */
.look{padding-top:clamp(80px,12vw,130px)}
.look .sechead{margin-bottom:18px}
.tour{display:grid;gap:16px;align-items:start}
@media (min-width:900px){.tour{grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:center}.tplate{height:min(76svh,760px);max-height:none;width:auto}}
.tplate{position:relative;overflow:hidden;aspect-ratio:4/5;max-height:80svh;background:var(--night-2);border-radius:4px}
.tplate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:0 0;will-change:transform}
@media (prefers-reduced-motion:no-preference){.tplate img{transition:transform 1.5s cubic-bezier(.45,.05,.2,1)}}
.tplate .spot{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:0;background:none;cursor:pointer;display:grid;place-items:center;transition:opacity .6s}
.tplate .spot::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 6px rgba(var(--gold-rgb),.18),0 0 18px 6px rgba(var(--gold-rgb),.35)}
.tplate .spot b{position:absolute;left:34px;top:50%;transform:translateY(-50%);font:400 .7rem var(--f-type);color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.8)}
@media (prefers-reduced-motion:no-preference){.tplate .spot::before{animation:breathe 3.6s ease-in-out infinite}}
.tplate.zoom .spot{opacity:0;pointer-events:none}
.tnote{position:absolute;left:14px;right:14px;bottom:14px;max-width:420px;padding:12px 16px 14px;opacity:0;transform:translateY(14px) rotate(-1deg);pointer-events:none}
.tnote.on{opacity:1;transform:rotate(-1deg)}
@media (prefers-reduced-motion:no-preference){.tnote{transition:opacity .7s var(--slow) .8s,transform .7s var(--slow) .8s}.tnote.on{transition-delay:1s}}
.tnote small{position:relative;z-index:1;font:400 .62rem var(--f-type);letter-spacing:.2em;text-transform:uppercase;color:var(--paper-label)}
.tnote p{position:relative;z-index:1;margin:2px 0 0;font:400 1.7rem/1.05 var(--f-hand)}
html[lang="th"] .tnote p{font:400 1.02rem/1.45 "Sriracha",cursive}
.tside{display:grid;gap:18px;align-content:start}
