/* Timetable · "One night" (Dell 28 Oct: O + slim strip).
   One season = one night on the hill (dusk → first light).
   First screen tells three things: when the next train leaves · how far into the night we are · watch the newest stop.
   Data: atlas/atlas.json (stops: outAt = UTC ISO · title null until it airs · url · optional img = episode frame · optional len "4:12")
         + state.json / Firebase via live.js (auction line). Times always in the viewer's zone. No countdown, no fake dates. */
:root{color-scheme:dark;--ink:#e8e4da;--muted:#b4bccb;--dim:#8e97ab;--lantern:#f2b45a;--paper:#ece6d6;--pink:#2a2620;--pmuted:#5d5545;--stamp:#8c2a33;--line:rgba(232,228,218,.12);

*{box-sizing:border-box}html,body{margin:0}

a{color:inherit}
:focus-visible{outline:2px solid var(--lantern);outline-offset:3px;border-radius:4px}

.tt-top{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 0}

.tt-lang button{border:0;background:none;color:var(--muted);font:500 .78rem var(--mono);padding:4px 10px;border-radius:999px;cursor:pointer}
.tt-lang button[aria-pressed="true"]{background:var(--ink);color:#141a30}
.tt-kick{margin:14px 16px 0;font:500 11px var(--mono);letter-spacing:.18em;color:var(--muted)}
.tt h1{font:700 30px/1 var(--hand);margin:4px 16px 12px;color:var(--paper)}

.tt-tk{position:relative;margin:0 16px;display:grid;grid-template-columns:1fr 74px;background:var(--paper);color:var(--pink);border-radius:10px;box-shadow:0 26px 40px -18px rgba(0,0,0,.85)}

.tt-t{position:relative;display:inline-grid;place-items:center;width:27px;height:42px;border-radius:4px;background:linear-gradient(#2c3248 0 49%,#20253a 51%);font:400 27px/1 var(--type);color:#f6eedc;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tt-t.wd{width:auto;padding:0 7px;font:400 24px/1 "Sriracha",cursive}

html[lang="th"] .tt-t{font-family:"Special Elite","Sriracha",monospace}

.tt-tk .stub b{display:block;font:400 34px/1 var(--type);color:var(--stamp);letter-spacing:0}
.tt-tk::before,.tt-tk::after{content:"";position:absolute;right:74px;width:16px;height:16px;border-radius:50%;background:#0d1230;transform:translateX(50%)}
html[data-phase="dawn"] .tt-tk::before,html[data-phase="dawn"] .tt-tk::after{background:#1a1838}
.tt-tk::before{top:-8px}.tt-tk::after{bottom:-8px}

.tt-night{position:relative;height:58px;margin:14px 16px 0;border-radius:10px;overflow:hidden;background:var(--band)}

.tt-dot.f{background:#3a4166}
.tt-lamp{position:absolute;bottom:13px;width:16px;height:16px;margin-left:-8px;border-radius:50%;z-index:2;background:radial-gradient(circle at 50% 55%,#fff3d8,#f8c873 55%,#c0782e);box-shadow:0 0 0 3px rgba(242,180,90,.22)}

.tt-now.edgeL{transform:none}.tt-now.edgeR{transform:translateX(-100%)}
.tt-cap{display:flex;flex-wrap:wrap;row-gap:2px;justify-content:space-between;gap:10px;margin:8px 16px 0;font:500 11px var(--mono);letter-spacing:.06em;color:var(--muted)}

.tt h2{font:700 26px/1 var(--hand);color:var(--paper);margin:26px 16px 12px}
.tt-big{margin:0 16px}
.tt-win{display:block;text-decoration:none;color:inherit}

.tt-win:hover .fr{transform:translateY(-2px)}
.tt-win .im{position:relative;aspect-ratio:16/9;border-radius:26px 26px 5px 5px;overflow:hidden;background:#1d2244 center/cover no-repeat}

.tt-win .c small{font:500 11px var(--mono);letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.tt-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px}

.tt-row b{color:var(--ink);font-weight:600}
.tt-row .go{font:500 11px var(--mono);letter-spacing:.1em;color:var(--lantern);white-space:nowrap}

.tt-row .go.dim{color:var(--dim)}

.tt-demo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 16px 0;font:500 10px var(--mono);color:var(--lantern)}

 .tt-list{grid-template-columns:1fr 1fr}
 .tt-rows{margin:34px 40px 0}.tt-demo{margin-left:40px}

}

@media (max-width:420px){.tt-t{width:25px;height:40px;font-size:25px}.tt-t.wd{font-size:21px}.tt-kick{display:none}.tt h1{margin-top:14px}}

var BANDS=['linear-gradient(90deg,#6a4a7a 0%,#3a3068 20%,#141c48 55%,#121a40 85%,#2a2c52 100%)','linear-gradient(90deg,#5b3f6e 0%,#2b2a5e 18%,#121a44 50%,#18234e 80%,#5a5878 96%,#8d7f8a 100%)',

var PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
/* split-flap: tiles settle once into the real value */
function flaps(el,str,day){var ch=str.split('');el.innerHTML=(day?'<i class="tt-t wd">'+esc(day)+'</i><i class="tt-t s"></i>':'')+ch.map(function(c){return c===' '?'<i class="tt-t s"></i>':c===':'?'<i class="tt-t s">:</i>':'<i class="tt-t">'+esc(c)+'</i>';}).join('');
  if(RM||flaps.done===str)return;flaps.done=str;var tiles=[].slice.call(el.querySelectorAll('.tt-t:not(.s):not(.wd)')),POOL='ABCDEFGHJKLMNOPRSTUVWXYZ0123456789',k=0;
  var iv=setInterval(function(){k++;tiles.forEach(function(t,i){var target=ch.filter(function(c){return c!==' '&&c!==':';})[i];if(k>4+i*1.4){t.textContent=target;}else t.textContent=/[0-9]/.test(target)?String(Math.floor(Math.random()*10)):POOL[Math.floor(Math.random()*24)];});
    if(k>6+tiles.length*1.4){clearInterval(iv);tiles.forEach(function(t,i){t.textContent=ch.filter(function(c){return c!==' '&&c!==':';})[i];});}},55);}
function win(s,big,isNew){var p=aired(s),tag=p&&s.url?'a':'div',img=p&&s.img?' style="background-image:url(\''+esc(s.img)+'\')"':'';
  var title=p?(s.title?(s.title[LANG]||s.title.en):T('untitled',{n:nn(s.ep)})):T('fogT');
  var meta=p?(big?(s.outAt?dShort(new Date(s.outAt)).toUpperCase():'')+(s.len?' · '+esc(s.len):''):nn(s.ep)):nn(s.ep)+(s.outAt?' · '+dShort(new Date(s.outAt)).toUpperCase():'');
  return '<'+tag+' class="tt-win'+(p?'':' fog')+'"'+(tag==='a'?' href="'+esc(s.url)+'" target="_blank" rel="noopener"':'')+'><div class="fr"><div class="im"'+img+'>'+(p&&!s.img?'<span class="noimg">'+nn(s.ep)+'</span>':'')+
   (isNew?'<span class="tt-new">'+T('newT')+nn(s.ep)+'</span>':'')+(big&&p&&s.url?'<span class="tt-play">'+PLAY+'</span>':'')+'</div></div><div class="c"><b>'+esc(title)+'</b><small>'+meta+'</small></div></'+tag+'>';}
function render(){if(ATLAS){window.lhReady&&lhReady();document.documentElement.classList.add("tt-ready");} /* r12c: the first render runs before the data — it used to unveil the empty ticket */if(ATLAS&&!window._ttFl){window._ttFl=1;setTimeout(function(){window.lhSound&&lhSound.play("flap",{n:10});},250);}
  document.documentElement.lang=LANG;document.title=T('h1')+' · littlehill';
  [].forEach.call(document.querySelectorAll('.tt-lang button'),function(b){b.setAttribute('aria-pressed',b.dataset.l===LANG?'true':'false');});
  $('kick').textContent=T('kick');$('h1').textContent=T('h1');
  if(!ATLAS)return;var S=ATLAS.stops||[],passed=S.filter(aired).length,nxt=null;
  for(var i=0;i<S.length;i++){if(!aired(S[i])){nxt=S[i];break;}}
  var end=passed>=16,phase=end?4:Math.min(3,Math.floor(passed/4)),A=(STATE&&STATE.auction)||{};
  document.documentElement.dataset.phase=end?'dawn':'night';
  /* ① ticket */
  if(end){$('tkK').textContent=T('arrived');flaps($('fl'),T('dawn'));$('tkW').innerHTML=T('over');$('stub').innerHTML='<span>'+T('stop')+'<b>16</b></span>';}
  else if(nxt&&nxt.outAt){var d=new Date(nxt.outAt);$('tkK').textContent=T('next');if(LANG==='th')flaps($('fl'),hm(d),['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'][d.getDay()]);else flaps($('fl'),dayShort(d)+' '+hm(d));
    $('tkW').innerHTML=esc(dShort(d))+' · '+T('your')+' · <b>'+esc(relDay(d))+'</b>';$('stub').innerHTML='<span>'+T('stop')+'<b>'+nn(nxt.ep)+'</b></span>';
    $('tkSR').textContent=T('next')+': '+dLong(d);}
  else{$('tkK').textContent=T('soonK');$('fl').innerHTML='';flaps.done=null;$('tkW').innerHTML=T('soonT');$('stub').innerHTML=nxt?'<span>'+T('stop')+'<b>'+nn(nxt.ep)+'</b></span>':'';}
  var dl=end?T('dlEnd'):T('dl');$('dlD').textContent=dl;
  /* ② strip */
  var n=$('night');n.style.setProperty('--band',BANDS[phase]);var lampAt=end?16:(nxt?nxt.ep:16);n.style.setProperty('--fx',end?16:lampAt);
  $('nl1').textContent=T('dusk');$('nl2').textContent=T('light');
  var h='';for(var k=1;k<=16;k++){var x='calc(100% * '+((k-.5)/16).toFixed(4)+')';
    if(k===lampAt){h+='<i class="tt-lamp" style="left:'+x+'"></i><span class="tt-now'+(k===1?' edgeL':k===16?' edgeR':'')+'" style="left:'+(k===1?'6px':k===16?'calc(100% - 6px)':x)+'">'+(end?T('tArr'):nxt&&nxt.outAt&&sameDay(nxt.outAt)?T('tTonight'):T('tNext'))+'</span>';continue;}
    h+='<i class="tt-dot'+(k>passed?' f':'')+'" style="left:'+x+'"></i>';}
  $('pts').innerHTML=h;$('nl1').style.visibility=lampAt<=3?'hidden':'';$('nl2').style.visibility=lampAt>=14?'hidden':'';$('c1').textContent=T('one');$('c2').textContent=end?T('all'):T('passed',{n:passed});
  /* ③ */
  var c1='',c2='';
  if(passed===0){var f=S[0]&&S[0].outAt?new Date(S[0].outAt):null;c1='<h2>'+T('none')+'</h2><div class="tt-empty"><b>'+(f?T('first',{d:esc(dayShort(f)+' '+dShort(f))}):T('soonT'))+'</b><span>'+(f?T('firstS',{t:hm(f)}):T('firstNo'))+'</span></div>';}
  else{var newest=S.filter(aired).slice(-1)[0];c1='<h2>'+T('watch')+'</h2><div class="tt-big">'+win(newest,true,!end)+'</div>';}
  c1+='<p class="tt-dl m">'+esc(dl)+'</p>';
  var list=[];if(end){list=S.slice(0,15).reverse();}else{S.forEach(function(s){if(aired(s)&&s!==S.filter(aired).slice(-1)[0])list.unshift(s);});var ahead=S.filter(function(s){return !aired(s);}).slice(0,passed===0?3:2);list=list.slice(0,passed===0?0:4).concat(ahead);}
  if(list.length)c2='<h2>'+(end?T('every'):T('stops'))+'</h2><div class="tt-list">'+list.map(function(s){return win(s,false,false);}).join('')+'</div>';
  $('col1').innerHTML=c1;$('col2').innerHTML=c2;
  /* ④ rows */
  var r='',no=esc(A.no||'001'),st=A.status||'';
  if(st==='open'||st==='extended'){var ca=A.closeAt?new Date(A.closeAt):null,past=ca&&ca.getTime()<=NOW;r+='<a class="tt-row hot" href="../auction/"><span>'+(past?T('aucCheck',{no:no}):T('aucOpen',{no:no,d:ca?esc(dLong(ca)):''}))+'</span><span class="go">'+T('bid')+'</span></a>';}
  else if(st==='closed'||st==='waiting')r+='<a class="tt-row" href="../auction/"><span>'+T('aucClosed',{no:no})+'</span><span class="go">'+T('see')+'</span></a>';
  else if(st==='sold')r+='<a class="tt-row" href="../traveller/'+no+'/"><span>'+T('aucSold',{no:no})+'</span><span class="go">'+T('see')+'</span></a>';
  else if(A.opensAt)r+='<a class="tt-row" href="../auction/"><span>'+T('aucSoon',{no:no,d:esc(dLong(new Date(A.opensAt)))})+'</span><span class="go">'+T('see')+'</span></a>';
  var wrapOn=STATE&&STATE.pages&&STATE.pages.season1===true;
  if(end&&wrapOn)r+='<a class="tt-row" href="../season/1/"><span>'+T('wrapRow')+'</span><span class="go">'+T('open')+'</span></a>';
  else if(!end)r+='<div class="tt-row"><span>'+T('mapRow')+'</span><span class="go dim">'+T('later')+'</span></div>';
  if(end)r+='<div class="tt-row"><span>'+T('s2')+'</span><span class="go dim">'+T('soon')+'</span></div>';
  $('rows').innerHTML=r;
}
/* preview-only: sample nights to try every state (window.LH_PREVIEW is set only by the private preview) */
function sample(mode){var base=Date.UTC(2026,10,30,13),S=[],aired={pre:0,mid:2,auc:4,end:16}[mode],off={pre:-3,mid:2,auc:4,end:20}[mode];
  for(var i=1;i<=16;i++){var out=i<=6||mode==='end'?new Date(base+(i-1)*864e5).toISOString():null;S.push({ep:i,stop:'Stop '+nn(i),outAt:out,title:i<=aired?{en:'[sample title '+i+']',th:'[ชื่อตอนตัวอย่าง '+i+']'}:null,url:i<=aired?'https://www.youtube.com/':null,len:i<=aired?'4:1'+(i%10):null});}
  NOW=base+(off-.5)*864e5+(mode==='auc'?14*36e5:0);
  var A={pre:{status:'soon',no:'001',opensAt:new Date(base+3*864e5).toISOString()},mid:{status:'soon',no:'001',opensAt:new Date(base+3*864e5).toISOString()},auc:{status:'open',no:'001',closeAt:new Date(base+6*864e5-11*36e5).toISOString()},end:{status:'sold',no:'001'}}[mode];
  return {atlas:{stops:S},state:{auction:A,pages:{season1:mode==='end'}}};}
function demoBar(){if(!window.LH_PREVIEW)return;var d=$('demo');d.className='tt-demo';d.innerHTML='PREVIEW · sample states → '+['pre','mid','auc','end'].map(function(m){return '<button data-m="'+m+'">'+{pre:'before ep1',mid:'ep2 aired',auc:'auction open',end:'season over'}[m]+'</button>';}).join('')+'<button data-m="real">real data</button>';
  [].forEach.call(d.querySelectorAll('button'),function(b){b.onclick=function(){demo=b.dataset.m;[].forEach.call(d.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
    if(demo==='real'){NOW=Date.now();ATLAS=REAL.atlas;STATE=REAL.state;}else{var s=sample(demo);ATLAS=s.atlas;STATE=s.state;}flaps.done=null;render();};});}
var REAL={atlas:null,state:null};
[].forEach.call(document.querySelectorAll('.tt-lang button'),function(b){b.onclick=function(){LANG=b.dataset.l;store('lh-lang',LANG);flaps.done=null;render();};});
LANG=store('lh-lang')==='th'?'th':'en';render();demoBar();
function getJ(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();});}
var getState=function(){return window.lhLive?lhLive.get('../state.json?t='+Date.now()):getJ('../state.json?t='+Date.now());};
Promise.all([getJ('../atlas/atlas.json?t='+Date.now()).catch(function(){return {stops:[]};}),getState().catch(function(){return null;})]).then(function(r){REAL.atlas=r[0];REAL.state=r[1];
  if(window.LH_PREVIEW&&!r[0].stops.some(function(s){return s.outAt;})){var b=document.querySelector('#demo button[data-m="mid"]');if(b){b.click();return;}}
  ATLAS=r[0];STATE=r[1];render();});
setInterval(function(){if(demo&&demo!=='real')return;NOW=Date.now();getState().then(function(s){STATE=s;REAL.state=s;render();},function(){});},60000);
})();
</script>
