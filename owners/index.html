<style>
/* owners' wall: opt-in only · shows the handle the owner chose + which traveller · nothing else (no dates, no country, no links) */
.wall{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tag{padding:14px 14px 12px;display:grid;gap:4px;position:relative;transform:rotate(var(--r,0deg))}
.tag::before{content:"";position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:rgba(var(--lh-paper-ink-rgb),.18)}
.tag .h{font:700 1.5rem/1.1 var(--f-hand);word-break:break-word}
.tag a{font:500 .72rem var(--f-mono);letter-spacing:.08em;color:var(--lh-stamp-wait);text-decoration:none}
.tag .was{font:500 .64rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
.empty{border:1.5px dashed rgba(var(--lh-ink-rgb),.26);border-radius:8px;padding:22px 18px;color:var(--muted);text-align:center;margin-top:22px}
.empty .hand{display:block;font-size:1.5rem;color:var(--ink);opacity:.8}
html[lang="th"] .empty .hand{font-family:"Sriracha","Caveat",cursive;font-weight:400}
.how{margin-top:26px;max-width:36em;background:rgba(var(--lh-deep-rgb),.5);border-radius:8px;padding:10px 12px}
.how h2{font:500 .76rem var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.how ul{margin:0;padding-left:1.1em;color:var(--muted)}
.how li{margin:2px 0}
</style>

<script src="../assets/future.js"></script>
<script>
(function(){
  var TX={
    en:{kicker:"littlehill · owners' wall",title:"Owners' wall",lede:'Some travellers have gone home with someone. These are the owners who asked to be on the wall.',
        with:'with Traveller No.{no} →',was:'travelled with No.{no}',
        emptyH:'The wall is still bare.',emptyB:'Names go up only when an owner asks for it.',
        howH:'How the wall works',
        how:['Nobody is added without asking. Owners are off the wall unless they say yes.','Only the handle the owner picks is shown. No real names, places or dates.','Changed your mind? Ask and the name comes down.']},
    th:{kicker:'littlehill · กำแพงเจ้าของ',title:'กำแพงเจ้าของ',lede:'นักเดินทางบางคนได้กลับบ้านกับใครสักคนแล้ว · ที่นี่คือเจ้าของที่ขอขึ้นกำแพงเอง',
        with:'กับ Traveller No.{no} →',was:'เคยเดินทางกับ No.{no}',
        emptyH:'กำแพงยังว่างอยู่',emptyB:'ชื่อจะขึ้นก็ต่อเมื่อเจ้าของขอเท่านั้น',
        howH:'กำแพงนี้ทำงานยังไง',
        how:['ไม่มีใครถูกใส่ชื่อโดยไม่ถาม · ถ้าเจ้าของไม่ตอบตกลง จะไม่อยู่บนกำแพง','แสดงแค่ชื่อเล่น (handle) ที่เจ้าของเลือก · ไม่มีชื่อจริง ที่อยู่ หรือวันที่','เปลี่ยนใจเมื่อไหร่ บอกได้เลย ชื่อจะถูกเอาออก']}};
  var REG=LH.inline('fb-reg')||{travellers:[]};
  var $=function(id){return document.getElementById(id);};
  function clean(h){return typeof h==='string'?h.trim().slice(0,40):'';}
  function entries(){var out=[];
    (REG.travellers||[]).forEach(function(t){if(!t||!t.no)return;
      if(t.ownerOptIn===true&&clean(t.owner))out.push({h:clean(t.owner),no:t.no,page:t.page,cur:true});
      (t.history||[]).forEach(function(x){if(x&&x.optIn===true&&clean(x.owner))out.push({h:clean(x.owner),no:t.no,page:t.page,cur:false});});});
    return out;}
  function render(){
    var L=TX[LH.lang],E=LH.esc,list=entries(),R=['-1.2deg','.8deg','-.4deg','1.1deg','-.9deg','.5deg'];
    $('kicker').textContent=L.kicker;$('title').textContent=L.title;$('lede').textContent=L.lede;$('h-how').textContent=L.howH;
    $('how').innerHTML=L.how.map(function(x){return '<li>'+E(x)+'</li>';}).join('');
    $('wall').innerHTML=list.map(function(o,i){
      var link=o.page?'<a href="../'+E(o.page)+'">'+E(L.with.replace('{no}',o.no))+'</a>':'';
      return '<li class="tag paper" style="--r:'+R[i%R.length]+'"><span class="h">'+E(o.h)+'</span>'+(o.cur?link:'<span class="was">'+E(L.was.replace('{no}',o.no))+'</span>')+'</li>';}).join('');
    $('wall').hidden=!list.length;
    $('empty').hidden=!!list.length;
    $('empty').innerHTML='<span class="hand">'+E(L.emptyH)+'</span>'+E(L.emptyB);
  }
  LH.start({key:'owners',root:'../',render:render}).then(function(show){
    if(!show)return;
    LH.get('../travellers/travellers.json').then(function(j){REG=j;LH.redraw();},function(){});
  });
})();
</script>
